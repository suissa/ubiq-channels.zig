# Protocols exposed by the Caddy edge. The Zig backend remains HTTP/1.1.
http1: true
http2: true
http3: true

# TLS mode: "internal" for local development, "managed" for a public hostname.
tls_mode: internal
https_host: localhost
https_port: 8443
http_host: localhost
http_port: 8081
backend_host: 127.0.0.1
backend_port: 8080
