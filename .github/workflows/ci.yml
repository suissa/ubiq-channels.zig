name: Zig CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run Zig tests
        run: zig build test
      - name: Install server executable
        run: zig build
      - name: Live HTTP, SSE, and WebSocket smoke tests
        run: python3 tests/live_smoke.py zig-out/bin/ubiq-server
      - name: Validate Python scripts
        run: python3 -m py_compile bench/benchmark.py tests/live_smoke.py
