name: Zig CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run Zig tests
        run: zig build test
      - name: Validate benchmark runner syntax
        run: python3 -m py_compile bench/benchmark.py
